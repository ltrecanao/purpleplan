<!DOCTYPE html>
<!-- PurplePlan — pizarra colaborativa P2P
     SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PurplePlan | Pizarra colaborativa P2P</title>
    <meta name="description" content="Pizarra colaborativa en tiempo real: post-its, imágenes, dibujo libre y voz, directamente entre navegadores (P2P).">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="static/corazon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="vendor/peerjs.min.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body class="bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-gray-100 h-screen overflow-hidden flex flex-col font-sans select-none">

    <header class="border-b border-gray-200 dark:border-zinc-800 bg-white/90 dark:bg-zinc-950/90 backdrop-blur-md px-3 py-2 flex flex-col gap-2 z-30">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2 min-w-0">
                <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white shadow-lg shadow-purple-600/30 flex-shrink-0">
                    <i class="fa-solid fa-shapes text-xs"></i>
                </div>
                <div class="min-w-0">
                    <h1 class="font-bold text-xs tracking-wide">Purple<span class="text-purple-600">Plan</span></h1>
                    <div class="flex items-center gap-1.5 mt-0.5">
                        <span id="room-badge" class="text-[10px] text-gray-400 whitespace-nowrap leading-none">Desconectado</span>
                        <button id="copy-room-btn" onclick="copyRoomId()" class="hidden items-center justify-center gap-1 px-1.5 h-5 rounded-md bg-purple-50 dark:bg-purple-950/40 hover:bg-purple-100 dark:hover:bg-purple-950/60 border border-purple-100 dark:border-purple-900/50 active:scale-95 transition-all" title="Copiar y compartir el ID de la sala">
                            <span class="text-[10px] text-gray-400 dark:text-zinc-500 leading-none">Sala</span>
                            <span id="room-id-text" class="font-mono text-[10px] font-semibold text-purple-700 dark:text-purple-300 whitespace-nowrap leading-none"></span>
                            <i id="copy-room-icon" class="fa-solid fa-copy text-[8px] text-purple-500 dark:text-purple-400 leading-none"></i>
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex items-center space-x-1.5 flex-shrink-0">
                <button id="voice-btn" onclick="toggleVoice()" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-gray-200 dark:bg-zinc-800 hover:bg-purple-600 hover:text-white active:scale-95 transition flex items-center space-x-1">
                    <i id="voice-icon" class="fa-solid fa-microphone-slash"></i>
                    <span id="voice-txt" class="hidden sm:inline">Voz</span>
                </button>
                <button onclick="openRoomModal()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-purple-600 text-white shadow-md shadow-purple-600/20 active:scale-95 transition" title="Sala">
                    <i class="fa-solid fa-door-open"></i>
                </button>
                <button onclick="toggleTheme()" class="w-8 h-8 rounded-xl bg-gray-100 dark:bg-zinc-900 flex items-center justify-center active:scale-95 transition">
                    <i id="theme-icon" class="fa-solid fa-moon text-xs"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-1 overflow-x-auto scrollbar-hide touch-pan-x snap-x snap-proximity py-1 px-1.5 bg-gray-100 dark:bg-zinc-900 rounded-xl border border-gray-200 dark:border-zinc-800">
            <button onclick="addElement('sticky')" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-note-sticky text-purple-600"></i><span>Post-it</span>
            </button>
            <button onclick="openImageInputModal()" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-image text-purple-600"></i><span>Imagen</span>
            </button>
            <div class="h-4 w-px bg-gray-300 dark:bg-zinc-700 mx-1 flex-shrink-0"></div>
            <button onclick="toggleDrawMode()" id="pen-btn" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap" title="Dibujar">
                <i class="fa-solid fa-pen text-purple-600"></i><span>Dibujar</span>
            </button>
            <div id="shape-group" class="hidden snap-start flex-shrink-0 flex items-center gap-0.5 pl-1.5 border-l border-gray-300 dark:border-zinc-700">
                <button onclick="setShape('pen')" id="shape-pen-btn" class="shape-btn w-7 h-7 rounded-lg text-[11px] flex items-center justify-center hover:bg-white dark:hover:bg-zinc-800 transition" title="Lápiz libre">
                    <i class="fa-solid fa-pen-nib text-purple-600"></i>
                </button>
                <button onclick="setShape('line')" id="shape-line-btn" class="shape-btn w-7 h-7 rounded-lg text-[11px] flex items-center justify-center hover:bg-white dark:hover:bg-zinc-800 transition" title="Línea recta">
                    <i class="fa-solid fa-slash text-purple-600"></i>
                </button>
                <button onclick="setShape('rect')" id="shape-rect-btn" class="shape-btn w-7 h-7 rounded-lg text-[11px] flex items-center justify-center hover:bg-white dark:hover:bg-zinc-800 transition" title="Rectángulo">
                    <i class="fa-regular fa-square text-purple-600"></i>
                </button>
                <button onclick="setShape('oval')" id="shape-oval-btn" class="shape-btn w-7 h-7 rounded-lg text-[11px] flex items-center justify-center hover:bg-white dark:hover:bg-zinc-800 transition" title="Círculo">
                    <i class="fa-regular fa-circle text-purple-600"></i>
                </button>
            </div>
            <div class="h-4 w-px bg-gray-300 dark:bg-zinc-700 mx-1 flex-shrink-0"></div>
            <button onclick="undo()" id="undo-btn" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap" title="Deshacer">
                <i class="fa-solid fa-rotate-left text-purple-600"></i>
            </button>
            <button onclick="redo()" id="redo-btn" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition flex items-center gap-1.5 whitespace-nowrap" title="Rehacer">
                <i class="fa-solid fa-rotate-right text-purple-600"></i>
            </button>
            <div class="h-4 w-px bg-gray-300 dark:bg-zinc-700 mx-1 flex-shrink-0"></div>
            <button onclick="saveLocal()" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs text-gray-600 dark:text-zinc-300 hover:text-purple-600 hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition whitespace-nowrap" title="Guardar JSON">
                <i class="fa-solid fa-download"></i>
            </button>
            <button type="button" onclick="triggerJsonUpload()" class="snap-start flex-shrink-0 px-2.5 py-1.5 rounded-lg text-xs text-gray-600 dark:text-zinc-300 hover:text-purple-600 hover:bg-white dark:hover:bg-zinc-800 active:scale-95 transition whitespace-nowrap" title="Cargar JSON">
                <i class="fa-solid fa-upload"></i>
            </button>
            <input type="file" id="json-file-input" accept=".json,application/json" class="hidden" onchange="loadLocal(event)">
        </div>
    </header>

    <main id="canvas-container" class="relative flex-1 overflow-hidden bg-gray-50 dark:bg-zinc-950 cursor-grab active:cursor-grabbing">
        <div id="canvas-content" class="absolute w-[8000px] h-[8000px] top-0 left-0 origin-top-left will-change-transform">
            <svg id="connections-layer" xmlns="http://www.w3.org/2000/svg"></svg>
            <svg id="drawing-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>
    </main>

    <div class="absolute bottom-6 right-6 z-40 flex flex-col bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md border border-gray-200 dark:border-zinc-800 rounded-2xl shadow-xl overflow-hidden">
        <button onclick="adjustZoom(0.15)" class="w-10 h-10 flex items-center justify-center hover:bg-purple-600 hover:text-white active:scale-95 transition text-sm font-bold border-b border-gray-200 dark:border-zinc-800" title="Acercar">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button id="zoom-display" onclick="resetZoom()" class="w-10 h-8 flex items-center justify-center hover:bg-purple-600 hover:text-white active:scale-95 transition text-[10px] font-bold border-b border-gray-200 dark:border-zinc-800" title="Restablecer Zoom">
            100%
        </button>
        <button onclick="adjustZoom(-0.15)" class="w-10 h-10 flex items-center justify-center hover:bg-purple-600 hover:text-white active:scale-95 transition text-sm font-bold" title="Alejar">
            <i class="fa-solid fa-minus"></i>
        </button>
    </div>

    <div id="image-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="closeImageModal()">
        <img id="modal-img" src="" class="max-w-full max-h-full rounded-2xl shadow-2xl object-contain" alt="Imagen ampliada">
    </div>

    <div id="image-input-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="closeImageInputModal()">
        <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-image text-purple-600"></i>
                    <span>Agregar Imagen</span>
                </h3>
                <button onclick="closeImageInputModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <label class="block w-full cursor-pointer">
                <div class="border-2 border-dashed border-gray-300 dark:border-zinc-700 rounded-xl p-4 text-center hover:border-purple-600 transition">
                    <i class="fa-solid fa-cloud-arrow-up text-purple-600 text-2xl mb-1"></i>
                    <p class="text-xs font-semibold">Subir desde dispositivo</p>
                    <p class="text-[10px] text-gray-400 mt-0.5">PNG, JPG, GIF, WebP…</p>
                </div>
                <input type="file" accept="image/*" onchange="handleImageFile(event)" class="hidden">
            </label>
            <div class="flex items-center my-4">
                <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-800"></div>
                <span class="px-2 text-[10px] text-gray-400">o</span>
                <div class="flex-1 h-px bg-gray-200 dark:bg-zinc-800"></div>
            </div>
            <div>
                <label class="block text-[11px] font-medium text-gray-500 dark:text-zinc-400 mb-1">URL de la imagen</label>
                <input type="text" id="image-url-input" placeholder="https://ejemplo.com/imagen.jpg" class="w-full bg-gray-100 dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-600">
            </div>
            <button onclick="addImageFromUrl()" class="w-full mt-3 py-2.5 rounded-xl text-xs bg-purple-600 text-white font-medium active:scale-95 transition">
                <i class="fa-solid fa-plus mr-1"></i> Agregar por URL
            </button>
        </div>
    </div>

    <div id="room-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-3">
                <h3 class="font-bold text-sm flex items-center space-x-2">
                    <i class="fa-solid fa-network-wired text-purple-600"></i>
                    <span>Conectar a Sala (P2P)</span>
                </h3>
                <button onclick="closeRoomModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block text-[11px] font-medium text-gray-500 dark:text-zinc-400 mb-1">ID de Sala o Anfitrión</label>
                    <input type="text" id="room-id-input" placeholder="ej. ab12-cd34" class="w-full bg-gray-100 dark:bg-zinc-950 border border-gray-200 dark:border-zinc-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-purple-600">
                </div>
            </div>
            <div class="flex space-x-2 mt-5">
                <button onclick="hostRoom()" class="flex-1 py-2.5 rounded-xl text-xs bg-gray-200 dark:bg-zinc-800 font-medium active:scale-95 transition">Crear Sala</button>
                <button onclick="joinRoom()" class="flex-1 py-2.5 rounded-xl text-xs bg-purple-600 text-white font-medium active:scale-95 transition">Unirse</button>
            </div>
            <p class="text-[10px] text-gray-400 mt-3 text-center leading-relaxed">Para invitar a alguien: creá la sala y compartí el ID que aparece arriba a la izquierda.</p>
        </div>
    </div>

    <div id="share-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="closeShareModal()">
        <div class="bg-white dark:bg-zinc-900 border border-gray-200 dark:border-zinc-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-1">
                <h3 class="font-bold text-sm flex items-center gap-2">
                    <i class="fa-solid fa-handshake text-purple-600"></i>
                    <span id="share-title-text">Sala creada</span>
                </h3>
                <button onclick="closeShareModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <p class="text-[11px] text-gray-500 dark:text-zinc-400 mb-3 leading-relaxed">Compartí este ID con quien quieras que se una: deben abrir el mismo tablero, tocar el botón de puerta y elegir <span class="font-semibold">Unirse</span>.</p>
            <div class="bg-purple-50 dark:bg-purple-950/40 border border-purple-100 dark:border-purple-900/50 rounded-xl px-3 py-3 text-center mb-3">
                <p id="share-id" class="font-mono text-sm font-semibold text-purple-700 dark:text-purple-300 break-all select-all"></p>
            </div>
            <button onclick="copyShareId()" class="w-full py-2.5 mb-2 rounded-xl text-xs bg-purple-600 text-white font-medium active:scale-95 transition"><i class="fa-solid fa-copy mr-1"></i> Copiar ID</button>
            <button onclick="copyShareLink()" class="w-full py-2.5 mb-2 rounded-xl text-xs bg-gray-200 dark:bg-zinc-800 font-medium active:scale-95 transition"><i class="fa-solid fa-link mr-1"></i> Copiar enlace de invitación</button>
            <button id="native-share-btn" onclick="nativeShare()" class="w-full py-2.5 rounded-xl text-xs bg-gray-200 dark:bg-zinc-800 font-medium active:scale-95 transition hidden"><i class="fa-solid fa-share-nodes mr-1"></i> Compartir…</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[70] bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-xs font-semibold px-4 py-2 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

</body>
</html>
